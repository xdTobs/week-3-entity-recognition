services:
  api:
    build: .
    environment:
      API_KEY: ${API_KEY:?Set API_KEY in .env before starting the API}
    ports:
      - "8000:8000"

  ui:
    build: ./ui
    ports:
      - "8080:8080"
    environment:
      PERSON_SERVICE_URL: http://api:8000
    depends_on:
      - api

volumes:
  model-cache:
